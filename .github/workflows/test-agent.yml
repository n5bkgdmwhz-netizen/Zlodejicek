name: Zlodeji agent - single auction write test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  write-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run single auction write test
        env:
          ROOM_CODE: ${{ secrets.ROOM_CODE }}
          TOKEN: ${{ secrets.TOKEN }}
          TARGET_AUCTION_ID: "a20-0"
          TEST_BID_AMOUNT: "43"
        run: python agent.py
