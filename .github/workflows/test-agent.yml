name: Zlodeji agent - auction bot

on:
  workflow_dispatch:
  schedule:
    - cron: "7,52 * * * *"

permissions:
  contents: read

concurrency:
  group: zlodeji-auction-bot
  cancel-in-progress: true

jobs:
  auction-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run auction bot
        env:
          ROOM_CODE: ${{ secrets.ROOM_CODE }}
          TOKEN: ${{ secrets.TOKEN }}
          TARGET_AUCTION_ID: ""
        run: python agent.py
