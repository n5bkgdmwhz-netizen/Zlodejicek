name: Zlodeji agent - pending recovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run pending recovery
        env:
          ROOM_CODE: ${{ secrets.ROOM_CODE }}
          TOKEN: ${{ secrets.TOKEN }}
          PENDING_REQUEST_ID: ${{ secrets.PENDING_REQUEST_ID }}
          PENDING_AUCTION_ID: ${{ secrets.PENDING_AUCTION_ID }}
          PENDING_AMOUNT: ${{ secrets.PENDING_AMOUNT }}
        run: python agent.py
